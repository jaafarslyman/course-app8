kind = "web"
previewPath = "/"
title = "Lughati Course App"
description = "An Arabic-first English-learning app with one-time learner access, course lessons and progress, group chat, and a Supabase-backed admin console."
version = "1.0.0"
id = "artifacts/course-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20216

[services.development]
run = "pnpm --filter @workspace/course-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/course-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/course-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20216"
BASE_PATH = "/"
